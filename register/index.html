<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Catch the Target" />
  <meta name="theme-color" content="#cfe3fb" />
  <title>Catch the Target — Registration</title>
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wallpaper"></div>

  <!-- status strip (operator info) -->
  <header class="topbar">
    <button class="chip" id="queueBtn" type="button"><span class="dot" id="linkDot"></span><span id="linkText">Connecting…</span></button>
  </header>

  <main>
    <!-- 01 Welcome -->
    <section class="screen" id="s-welcome">
      <div class="logo-card big"><img src="assets/logo.png" alt="Statistics Centre Abu Dhabi" /></div>
      <div class="welcome-title">
        <img src="../assets/ui/title-catch-the-target.png" alt="Catch the Target" />
      </div>
      <button class="btn primary bottom" id="startBtn" type="button"><span>Register</span></button>
    </section>

    <!-- 02 Mode -->
    <section class="screen hidden" id="s-mode">
      <div class="logo-card"><img src="assets/logo.png" alt="" /></div>
      <div class="card">
        <div class="card-head">
          <div><h2>Choose how to play</h2><p>One player or two players.</p></div>
        </div>
        <div class="modes">
          <button class="mode" type="button" data-mode="single">
            <svg viewBox="0 0 48 48"><circle cx="24" cy="15" r="8"/><path d="M8 42c0-9 7-15 16-15s16 6 16 15"/></svg>
            <b>Single player</b>
          </button>
          <button class="mode" type="button" data-mode="multi">
            <svg viewBox="0 0 48 48"><circle cx="16" cy="16" r="7"/><circle cx="33" cy="16" r="7"/><path d="M2 42c0-8 6-13 14-13s14 5 14 13"/><path d="M26 30c2-1 4-1.5 7-1.5 8 0 13 5 13 13"/></svg>
            <b>Two players</b>
          </button>
        </div>
      </div>
      <button class="btn ghost bottom" type="button" data-back="welcome"><span>Back</span></button>
    </section>

    <!-- 03 Registration form (Figma: Registration form) -->
    <section class="screen hidden" id="s-form">
      <div class="logo-card"><img src="assets/logo.png" alt="" /></div>
      <form class="card" id="form" novalidate autocomplete="off">
        <div class="step" id="stepChip"></div>
        <div class="card-head">
          <div><h2>Register to play</h2><p>Enter your details to join the game.</p></div>
        </div>
        <hr />
        <label class="field">
          <span class="labels"><b>Full name</b></span>
          <span class="input">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <input id="name" name="name" type="text" dir="auto" maxlength="30" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="next" />
            <span class="ph"><em>Enter your name</em></span>
          </span>
          <span class="err" id="nameErr"></span>
        </label>
        <label class="field">
          <span class="labels"><b>Email address <small>(optional)</small></b></span>
          <span class="input">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input id="email" name="email" type="email" dir="ltr" inputmode="email" maxlength="100" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
            <span class="ph"><em>name@example.com</em></span>
          </span>
          <span class="err" id="emailErr"></span>
        </label>
        <div class="form-msg" id="formMsg"></div>
      </form>
      <div class="bottom-row">
        <button class="btn ghost" type="button" id="formBack"><span>Back</span></button>
        <button class="btn primary" type="button" id="formNext"><span id="nextEn">Submit</span></button>
      </div>
    </section>

    <!-- 04 Thank you (Figma: Thank you) -->
    <section class="screen hidden" id="s-thanks">
      <div class="logo-card"><img src="assets/logo.png" alt="" /></div>
      <div class="card thanks">
        <div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2>Thank you!</h2>
        <div class="who" id="thanksNames"></div>
        <p>You're registered. Please wait for your turn.</p>
        <div class="turn" id="turnInfo"></div>
      </div>
      <button class="btn primary bottom" type="button" id="doneBtn"><span>Done</span></button>
    </section>
  </main>

  <!-- queue sheet (tap the status chip) -->
  <div class="sheet hidden" id="sheet">
    <div class="sheet-card">
      <div class="sheet-head"><h3>Queue</h3><button class="x" type="button" id="sheetClose" aria-label="Close">✕</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
